# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: vox

builds:
  - id: vox
    main: ./cmd/vox
    binary: vox
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X github.com/cafecito-games/vox/internal/buildinfo.version={{ .Version }}
        -X github.com/cafecito-games/vox/internal/buildinfo.commit={{ .FullCommit }}
        -X github.com/cafecito-games/vox/internal/buildinfo.date={{ .CommitDate }}
        -X github.com/cafecito-games/vox/internal/buildinfo.treeState={{ if .IsGitDirty }}dirty{{ else }}clean{{ end }}
    hooks:
      post:
        - cmd: bash .github/scripts/sign-macos.sh "{{ .Path }}" "{{ .Target }}" "{{ .IsSnapshot }}"
          output: true

archives:
  - id: binaries
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - license*
      - LICENSE*
      - readme*
      - README*
      - changelog*
      - CHANGELOG*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

homebrew_casks:
  - name: vox
    repository:
      owner: cafecito-games
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/cafecito-games/vox"
    description: "Discord CLI for humans and AI agents"

release:
  draft: false
  prerelease: auto
