name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Semantic version component to increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  goreleaser:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: macos-release
    runs-on: macos-15
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Check macOS signing secret availability
        env:
          MACOS_SIGNING_READY: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' && secrets.APPSTORE_CONNECT_ISSUER_ID != '' && secrets.APPSTORE_CONNECT_KEY_ID != '' && secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 != '' }}
        shell: bash
        run: |
          if [[ "$MACOS_SIGNING_READY" != "true" ]]; then
            echo '::error::Configure the macOS signing and notarization secrets in the macos-release environment before publishing.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11
      - name: Verify formatting
        run: golangci-lint fmt --diff ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Compute version and create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INCREMENT: ${{ inputs.increment }}
        shell: bash
        run: |
          set -euo pipefail

          release_error="${RUNNER_TEMP}/vox-latest-release-error"
          if latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>"${release_error}")"; then
            :
          elif grep -q 'HTTP 404' "${release_error}"; then
            latest_tag="v0.0.0"
          else
            cat "${release_error}" >&2
            exit 1
          fi

          current="${latest_tag#v}"
          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "${current}" =~ ${stable_semver} ]]; then
            echo "::error::Latest published release ${latest_tag} is not a stable semantic version"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "${current}"
          case "${RELEASE_INCREMENT}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "::error::Unknown release increment ${RELEASE_INCREMENT}"
              exit 1
              ;;
          esac

          head_sha="$(git rev-parse HEAD)"
          while true; do
            tag="v${major}.${minor}.${patch}"
            remote_tag="$(git ls-remote --tags origin "refs/tags/${tag}")"
            if [[ -z "$remote_tag" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag --annotate "${tag}" --message "vox ${tag}"
              git push origin "refs/tags/${tag}"
              echo "Created ${tag} at ${head_sha}"
              break
            fi

            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_sha="$(git rev-list -n 1 "${tag}")"
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>"${release_error}"; then
              echo "::error::${tag} already has a release."
              exit 1
            elif ! grep -q 'HTTP 404' "${release_error}"; then
              cat "${release_error}" >&2
              exit 1
            fi
            if [[ "${tag_sha}" == "${head_sha}" ]]; then
              echo "Reusing ${tag} at ${head_sha} for a release retry"
              break
            fi
            if ! git merge-base --is-ancestor "$tag_sha" "$head_sha"; then
              echo "::error::${tag} points outside the release history at ${tag_sha}."
              exit 1
            fi
            echo "Skipping ${tag}, which an earlier unpublished release attempt tagged."
            patch=$((patch + 1))
          done

          {
            echo "### Releasing ${tag}"
            echo "Previous release: \`${latest_tag}\`"
            echo "Increment: \`${RELEASE_INCREMENT}\`"
            echo "Commit: \`${head_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.20.3
          install-only: true
      - name: Sign, notarize, and publish release
        shell: bash
        run: bash .github/scripts/publish-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
